<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>MiCharla Tac - pizarra tactica de futbol 11 v 11</title>
<meta name="description" content="Pizarra tactica de futbol: dibuja el esquema, anima la jugada, exporta imagen o video y comparte por enlace. Gratis, sin cuenta, funciona sin conexion." />
<meta name="theme-color" content="#0b0f14" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="css/styles.css" />
<link rel="stylesheet" href="css/present.css" />
</head>
<body>
<div class="app" id="app">

  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 5v14" stroke="currentColor" stroke-width="1.4"/><circle cx="12" cy="12" r="3.1" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
      <div class="brand-text">
        <strong>MiCharla <span>Tac</span></strong>
        <input id="title" class="title-input" spellcheck="false" data-i18n-title="top.title" data-i18n-ph="top.title" />
      </div>
    </div>

    <div class="mode-switch" role="tablist" aria-label="Modo">
      <button class="mode active" id="mode-edit" data-i18n="top.edit" role="tab"></button>
      <button class="mode" id="mode-anim" data-i18n="top.animate" role="tab"></button>
    </div>

    <div class="topbar-actions">
      <div class="seg">
        <button class="icon-btn" id="undo" data-i18n-title="top.undo">
          <svg viewBox="0 0 24 24"><path d="M9 7H5V3M5.5 7.5A8 8 0 1 1 4 12" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="icon-btn" id="redo" data-i18n-title="top.redo">
          <svg viewBox="0 0 24 24"><path d="M15 7h4V3M18.5 7.5A8 8 0 1 0 20 12" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <button class="btn ghost wide-only" id="btn-open" data-i18n="top.library"></button>
      <button class="btn ghost wide-only" id="btn-save" data-i18n="top.save"></button>

      <div class="menu-wrap">
        <button class="btn ghost" id="btn-menu">
          <span class="wide-only" data-i18n="top.exportBtn"></span>
          <span class="m-only-inline" data-i18n="top.menu"></span>
          <svg class="caret" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <div class="menu" id="menu" hidden>
          <button data-act="present" data-i18n="present.open"></button>
          <hr />
          <button data-act="export" data-i18n="menu.exportAll"></button>
          <hr />
          <button data-act="json" data-i18n="menu.json"></button>
          <button data-act="import" data-i18n="menu.import"></button>
          <hr class="m-only" />
          <button class="m-only" data-act="save" data-i18n="menu.save"></button>
          <button class="m-only" data-act="library" data-i18n="menu.library"></button>
          <button class="m-only" data-act="share" data-i18n="menu.share"></button>
          <button class="m-only" data-act="help" data-i18n="menu.help"></button>
        </div>
      </div>

      <button class="btn primary" id="btn-share" data-i18n="top.share"></button>

      <select id="lang" class="lang" data-i18n-title="board.language"></select>

      <button class="icon-btn" id="btn-present" data-i18n-title="present.open">
        <svg viewBox="0 0 24 24"><path d="M3 4.5h18v12H3z" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M8.5 20.5L12 17l3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 8.4l4.6 2.1L10 12.6z" fill="currentColor"/></svg>
      </button>
      <button class="icon-btn wide-only" id="btn-help" data-i18n-title="top.help">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.3 2.4c-.6.2-.9.7-.9 1.4v.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="12" cy="16.6" r="1.05" fill="currentColor"/></svg>
      </button>
      <button class="icon-btn only-mobile" id="btn-panel" data-i18n-title="top.panels">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <div class="workspace">
    <nav class="rail" id="rail" aria-label="Herramientas"></nav>

    <main class="stage" id="stage">
      <canvas id="board"></canvas>

      <div class="stage-badge" id="frame-badge"></div>

      <div class="palette" id="palette" aria-label="Fichas"></div>

      <div class="zoomer">
        <button class="icon-btn" id="zoom-out" data-i18n-title="zoom.out"><svg viewBox="0 0 24 24"><path d="M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
        <button class="zoom-level" id="zoom-level" data-i18n-title="zoom.reset">100%</button>
        <button class="icon-btn" id="zoom-in" data-i18n-title="zoom.in"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
      </div>

      <div class="status" id="status"></div>

      <div class="empty-card" id="empty-card" hidden>
        <h3 data-i18n="empty.title"></h3>
        <p data-i18n="empty.body"></p>
        <div class="row">
          <button class="btn primary" id="empty-apply" data-i18n="empty.apply"></button>
          <button class="btn ghost" id="empty-blank" data-i18n="empty.blank"></button>
        </div>
      </div>

      <div class="coach" id="coach" hidden>
        <p id="coach-text"></p>
        <button class="btn tiny primary" id="coach-ok" data-i18n="coach.gotIt"></button>
      </div>
    </main>

    <aside class="panel" id="panel">
      <div class="tabs" role="tablist">
        <button class="tab active" data-tab="squad" data-i18n="tabs.squad" role="tab"></button>
        <button class="tab" data-tab="frame" data-i18n="tabs.frame" role="tab"></button>
        <button class="tab" data-tab="board" data-i18n="tabs.board" role="tab"></button>
      </div>

      <div class="inspector" id="inspector"></div>

      <section class="tabpane active" data-pane="squad">
        <div class="team-card" data-team="A">
          <div class="team-head">
            <span class="dot" data-teamdot="A"></span>
            <input class="team-name" data-team="A" data-i18n-ph="squad.home" aria-label="Local" />
            <input type="color" class="team-color" data-team="A" value="#e63946" data-i18n-title="sel.color" />
          </div>
          <div class="row">
            <select class="formation" data-team="A" aria-label="Formacion"></select>
            <button class="btn tiny" data-add-player="A" data-i18n="squad.addPlayer"></button>
          </div>
          <div class="chips tight">
            <button class="chip" data-mirror="A" data-i18n="squad.mirror"></button>
          </div>
          <ul class="roster" data-roster="A"></ul>
        </div>

        <div class="team-card" data-team="B">
          <div class="team-head">
            <span class="dot" data-teamdot="B"></span>
            <input class="team-name" data-team="B" data-i18n-ph="squad.away" aria-label="Visitante" />
            <input type="color" class="team-color" data-team="B" value="#1d6fe0" data-i18n-title="sel.color" />
          </div>
          <div class="row">
            <select class="formation" data-team="B" aria-label="Formacion"></select>
            <button class="btn tiny" data-add-player="B" data-i18n="squad.addPlayer"></button>
          </div>
          <div class="chips tight">
            <button class="chip" data-mirror="B" data-i18n="squad.mirror"></button>
          </div>
          <ul class="roster" data-roster="B"></ul>
        </div>

        <h4 class="section-title" data-i18n="squad.equipment"></h4>
        <div class="chips" id="equipment"></div>
      </section>

      <section class="tabpane" data-pane="frame">
        <div class="field">
          <label for="f-label" data-i18n="frame.label"></label>
          <input id="f-label" data-i18n-ph="frame.labelPh" />
        </div>
        <div class="field">
          <label><span data-i18n="frame.duration"></span> <output id="dur-out"></output></label>
          <input type="range" id="dur" min="200" max="5000" step="100" value="1000" />
        </div>
        <div class="field">
          <label for="f-easing" data-i18n="frame.easing"></label>
          <select id="f-easing">
            <option value="ease" data-i18n="frame.easeInOut"></option>
            <option value="linear" data-i18n="frame.linear"></option>
          </select>
        </div>
        <div class="field">
          <label for="note" data-i18n="frame.note"></label>
          <textarea id="note" rows="3" data-i18n-ph="frame.notePh"></textarea>
        </div>
        <div class="chips">
          <button class="chip" id="f-add" data-i18n="frame.add"></button>
          <button class="chip" id="f-dup" data-i18n="frame.dup"></button>
          <button class="chip" id="f-del" data-i18n="frame.del"></button>
          <button class="chip" id="f-clear" data-i18n="frame.clear"></button>
        </div>
        <h4 class="section-title" data-i18n="frame.assist"></h4>
        <label class="switch"><input type="checkbox" id="opt-trails" checked /> <span data-i18n="frame.trails"></span></label>
        <label class="switch"><input type="checkbox" id="opt-onion" /> <span data-i18n="frame.onion"></span></label>
        <p class="tip" data-i18n="frame.tip"></p>
      </section>

      <section class="tabpane" data-pane="board">
        <div class="field">
          <label for="pitch" data-i18n="board.pitch"></label>
          <select id="pitch"></select>
        </div>
        <div class="field">
          <label for="theme" data-i18n="board.surface"></label>
          <select id="theme"></select>
        </div>
        <label class="switch"><input type="checkbox" id="opt-stripes" checked /> <span data-i18n="board.stripes"></span></label>
        <label class="switch"><input type="checkbox" id="opt-thirds" /> <span data-i18n="board.thirds"></span></label>
        <label class="switch"><input type="checkbox" id="opt-grid" /> <span data-i18n="board.grid"></span></label>
        <label class="switch"><input type="checkbox" id="opt-snap" checked /> <span data-i18n="board.snap"></span></label>
        <label class="switch"><input type="checkbox" id="opt-numbers" checked /> <span data-i18n="board.numbers"></span></label>
        <label class="switch"><input type="checkbox" id="opt-names" checked /> <span data-i18n="board.names"></span></label>
        <div class="field">
          <label><span data-i18n="board.markerSize"></span> <output id="msize-out">100%</output></label>
          <input type="range" id="msize" min="60" max="170" step="5" value="100" />
        </div>
        <h4 class="section-title" data-i18n="board.danger"></h4>
        <div class="chips">
          <button class="chip" id="b-clear-draw" data-i18n="board.clearAll"></button>
          <button class="chip danger" id="b-reset" data-i18n="board.reset"></button>
        </div>
      </section>
    </aside>
  </div>

  <footer class="timeline" id="timeline">
    <div class="transport">
      <button class="icon-btn" id="t-prev" data-i18n-title="time.prev">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7M7 5v14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn play" id="t-play" data-i18n-title="time.play">
        <svg viewBox="0 0 24 24" id="play-icon"><path d="M8 5.5l11 6.5-11 6.5z" fill="currentColor"/></svg>
      </button>
      <button class="icon-btn" id="t-next" data-i18n-title="time.next">
        <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7M17 5v14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn" id="t-loop" data-i18n-title="time.loop">
        <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 8-8h5m0 0l-2.5-2.5M17 4l-2.5 2.5M20 12a8 8 0 0 1-8 8H7m0 0l2.5 2.5M7 20l2.5-2.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <select id="speed" class="speed" data-i18n-title="time.speed">
        <option value="0.25">0.25x</option>
        <option value="0.5">0.5x</option>
        <option value="1" selected>1x</option>
        <option value="1.5">1.5x</option>
        <option value="2">2x</option>
      </select>
      <span class="total" id="total"></span>
    </div>
    <div class="frames" id="frames"></div>
    <button class="btn tiny add-frame" id="add-frame" data-i18n="time.add"></button>
  </footer>

  <div class="toast" id="toast" hidden></div>

  <!-- Modo presentacion: se monta encima de todo. El atrapador cubre el lienzo
       para que en la cancha un roce no dibuje sobre la jugada. -->
  <div class="present-ui" id="present-ui" hidden>
    <div class="present-catch" id="present-catch"></div>

    <div class="present-head" id="present-head">
      <div class="present-phase" id="present-phase"></div>
      <div class="present-note" id="present-note" hidden></div>
    </div>

    <div class="present-bar" id="present-bar">
      <button class="pbtn" id="p-prev" data-i18n-title="time.prev">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7M7 5v14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="pbtn play" id="p-play" data-i18n-title="time.play">
        <svg viewBox="0 0 24 24" id="p-play-icon"><path d="M8 5.5l11 6.5-11 6.5z" fill="currentColor"/></svg>
      </button>
      <button class="pbtn" id="p-next" data-i18n-title="time.next">
        <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7M17 5v14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span class="present-count" id="present-count"></span>
      <button class="pbtn" id="p-loop" data-i18n-title="time.loop">
        <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 8-8h5m0 0l-2.5-2.5M17 4l-2.5 2.5M20 12a8 8 0 0 1-8 8H7m0 0l2.5 2.5M7 20l2.5-2.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="pbtn exit" id="p-exit" data-i18n-title="present.exit">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>
</div>

<dialog id="welcome-dlg" class="dlg">
  <h3 data-i18n="welcome.title"></h3>
  <ul class="bullets">
    <li data-i18n="welcome.b1"></li>
    <li data-i18n="welcome.b2"></li>
    <li data-i18n="welcome.b3"></li>
  </ul>
  <div class="row end">
    <button class="btn ghost" id="welcome-tour" data-i18n="welcome.tour"></button>
    <button class="btn primary" id="welcome-start" data-i18n="welcome.start"></button>
  </div>
</dialog>

<dialog id="help-dlg" class="dlg">
  <h3 data-i18n="help.title"></h3>
  <p class="muted" data-i18n="help.sub"></p>
  <div class="cols">
    <div>
      <h4 data-i18n="help.tools"></h4>
      <ul class="keys">
        <li><kbd>V</kbd> <span data-i18n="keys.select"></span></li>
        <li><kbd>P</kbd> <span data-i18n="keys.pass"></span></li>
        <li><kbd>R</kbd> <span data-i18n="keys.run"></span></li>
        <li><kbd>D</kbd> <span data-i18n="keys.dribble"></span></li>
        <li><kbd>S</kbd> <span data-i18n="keys.shot"></span></li>
        <li><kbd>L</kbd> <kbd>F</kbd> <span data-i18n="keys.lines"></span></li>
        <li><kbd>Z</kbd> <kbd>C</kbd> <kbd>G</kbd> <span data-i18n="keys.zones"></span></li>
        <li><kbd>T</kbd> <kbd>E</kbd> <span data-i18n="keys.text"></span></li>
      </ul>
    </div>
    <div>
      <h4 data-i18n="help.board"></h4>
      <ul class="keys">
        <li><kbd>Space</kbd> <span data-i18n="keys.play"></span></li>
        <li><kbd>N</kbd> <span data-i18n="keys.newFrame"></span></li>
        <li><kbd>,</kbd> <kbd>.</kbd> <span data-i18n="keys.frames"></span></li>
        <li><kbd>&larr;</kbd><kbd>&rarr;</kbd> <span data-i18n="keys.nudge"></span></li>
        <li><kbd>Del</kbd> <span data-i18n="keys.del"></span></li>
        <li><kbd>Shift</kbd>+drag <span data-i18n="keys.allFrames"></span></li>
        <li><kbd>Cmd</kbd>+<kbd>D</kbd> <span data-i18n="keys.dup"></span></li>
        <li><kbd>Cmd</kbd>+<kbd>Z</kbd> <span data-i18n="keys.undo"></span></li>
        <li><kbd>Scroll</kbd> <span data-i18n="keys.zoom"></span></li>
        <li><kbd>Space</kbd>+drag <span data-i18n="keys.pan"></span></li>
        <li><kbd>M</kbd> <span data-i18n="keys.present"></span></li>
      </ul>
    </div>
  </div>
  <h4 data-i18n="help.how"></h4>
  <p class="muted" data-i18n="help.howBody"></p>
  <form method="dialog" class="row end"><button class="btn primary" data-i18n="help.ok"></button></form>
</dialog>

<dialog id="lib-dlg" class="dlg">
  <h3 data-i18n="lib.title"></h3>
  <input id="lib-search" class="lib-search" data-i18n-ph="lib.search" />
  <div id="lib-list" class="lib-list"></div>
  <form method="dialog" class="row end"><button class="btn ghost" data-i18n="lib.close"></button></form>
</dialog>

<dialog id="export-dlg" class="dlg">
  <h3 data-i18n="menu.exportAll"></h3>
  <div class="export-grid" id="export-grid"></div>
  <div class="field">
    <label for="ex-size">Resolucion</label>
    <select id="ex-size">
      <option value="1200">1x - 1200px</option>
      <option value="2400" selected>2x - 2400px</option>
      <option value="3600">3x - 3600px</option>
    </select>
  </div>
  <label class="switch"><input type="checkbox" id="ex-brand" checked /> <span>Marca MiCharla Tac en la esquina</span></label>
  <form method="dialog" class="row end"><button class="btn ghost" data-i18n="lib.close"></button></form>
</dialog>

<input type="file" id="file-input" accept=".json,application/json" hidden />
<script type="module" src="js/main.js"></script>
</body>
</html>
